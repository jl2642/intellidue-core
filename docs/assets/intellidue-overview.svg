<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">IntelliDue — Human-supervised AI Due Diligence</title>
  <desc id="desc">Public overview of IntelliDue architecture, capabilities, product stack, quality gates and public/private data boundary.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2f5f"/>
      <stop offset="1" stop-color="#245fa8"/>
    </linearGradient>
    <style>
      .zh{font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}
      .title{font-size:54px;font-weight:800;fill:#fff}
      .sub{font-size:24px;font-weight:500;fill:#dbeafe}
      .tag{font-size:20px;font-weight:600;fill:#0d2f5f}
      .h2{font-size:30px;font-weight:800;fill:#123b70}
      .h3{font-size:21px;font-weight:800;fill:#123b70}
      .body{font-size:18px;font-weight:400;fill:#263648}
      .small{font-size:15px;font-weight:400;fill:#486174}
      .tiny{font-size:13px;font-weight:500;fill:#577086}
      .white{fill:#fff}
      .muted{fill:#eaf2fb}
      .card{fill:#fff;stroke:#c9d9eb;stroke-width:2}
      .soft{fill:#f5f9fd;stroke:#d5e2ef;stroke-width:2}
      .pill{fill:#e9f2fc;stroke:#bcd2ea;stroke-width:2}
      .arrow{stroke:#2f65a1;stroke-width:4;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2f65a1"/></marker>
  </defs>

  <rect width="1200" height="1600" fill="#f7fafc"/>
  <rect x="0" y="0" width="1200" height="235" fill="url(#hero)"/>
  <circle cx="1060" cy="90" r="145" fill="none" stroke="#8fb8e4" stroke-width="2" opacity=".35"/>
  <circle cx="1060" cy="90" r="105" fill="none" stroke="#8fb8e4" stroke-width="2" opacity=".25"/>
  <path d="M900 40 L1160 170 M920 170 L1160 25" stroke="#a9c7e7" stroke-width="2" opacity=".18"/>

  <text x="70" y="90" class="zh title">项目智能分析系统｜IntelliDue</text>
  <text x="70" y="135" class="zh sub">基于 ChatGPT 的 Human-supervised AI 尽调与投资分析平台</text>
  <text x="70" y="185" class="zh sub" style="font-size:20px">Evidence-grounded · Workpaper-driven · Quality-gated · Recoverable</text>

  <rect x="55" y="260" rx="18" ry="18" width="1090" height="105" class="soft"/>
  <text x="85" y="302" class="zh h2">它不是“把资料丢给AI写一份报告”</text>
  <text x="85" y="337" class="zh body">而是把资料审计、证据覆盖、专业底稿、分层报告、补充研究、质量门禁与最终交付组织成一条受控生产链。</text>

  <text x="60" y="420" class="zh h2">核心能力</text>

  <g transform="translate(60 450)">
    <rect width="340" height="170" rx="18" class="card"/>
    <circle cx="45" cy="42" r="24" fill="#1f5f9f"/><text x="45" y="50" text-anchor="middle" class="zh white" style="font-size:23px;font-weight:800">1</text>
    <text x="82" y="48" class="zh h3">资料审计与整理</text>
    <text x="28" y="88" class="zh body">识别文件人口、重复件、版本、</text><text x="28" y="116" class="zh body">Compound Documents 与资料类别；</text><text x="28" y="144" class="zh small">区分“存在 / 已读 / 已审 / 可支持结论”。</text>
  </g>
  <g transform="translate(430 450)">
    <rect width="340" height="170" rx="18" class="card"/>
    <circle cx="45" cy="42" r="24" fill="#1f5f9f"/><text x="45" y="50" text-anchor="middle" class="zh white" style="font-size:23px;font-weight:800">2</text>
    <text x="82" y="48" class="zh h3">证据链与覆盖管理</text>
    <text x="28" y="88" class="zh body">重大判断原则上可沿：</text><text x="28" y="118" class="zh small">报告 → 底稿 → 事实/计算 → 原始资料</text><text x="28" y="146" class="zh small">→ Native Locator / 页码 / 条款</text>
  </g>
  <g transform="translate(800 450)">
    <rect width="340" height="170" rx="18" class="card"/>
    <circle cx="45" cy="42" r="24" fill="#1f5f9f"/><text x="45" y="50" text-anchor="middle" class="zh white" style="font-size:23px;font-weight:800">3</text>
    <text x="82" y="48" class="zh h3">专业底稿生成</text>
    <text x="28" y="88" class="zh body">治理/交易、财务/QoE/税务、</text><text x="28" y="116" class="zh body">商业/运营、工程/技术/IP、</text><text x="28" y="144" class="zh small">许可/HSE/质量等专业工作底稿。</text>
  </g>

  <g transform="translate(60 645)">
    <rect width="340" height="170" rx="18" class="card"/>
    <circle cx="45" cy="42" r="24" fill="#1f5f9f"/><text x="45" y="50" text-anchor="middle" class="zh white" style="font-size:23px;font-weight:800">4</text>
    <text x="82" y="48" class="zh h3">联网补充与 Current 更新</text>
    <text x="28" y="88" class="zh body">根据证据缺口自主判断是否补充</text><text x="28" y="116" class="zh body">官方公开信息、行业数据与 Current</text><text x="28" y="144" class="zh small">状态，并与企业提供资料保持分层。</text>
  </g>
  <g transform="translate(430 645)">
    <rect width="340" height="170" rx="18" class="card"/>
    <circle cx="45" cy="42" r="24" fill="#1f5f9f"/><text x="45" y="50" text-anchor="middle" class="zh white" style="font-size:23px;font-weight:800">5</text>
    <text x="82" y="48" class="zh h3">增量更新与选择性返工</text>
    <text x="28" y="88" class="zh body">新资料、新证据、新专项意见进入后，</text><text x="28" y="116" class="zh body">重开最早受影响 Parent，保留未受影响</text><text x="28" y="144" class="zh small">的已验收成果，而不是整套推倒重做。</text>
  </g>
  <g transform="translate(800 645)">
    <rect width="340" height="170" rx="18" class="card"/>
    <circle cx="45" cy="42" r="24" fill="#1f5f9f"/><text x="45" y="50" text-anchor="middle" class="zh white" style="font-size:23px;font-weight:800">6</text>
    <text x="82" y="48" class="zh h3">项目复盘与持续改进</text>
    <text x="28" y="88" class="zh body">项目结束后执行 Retrospective，识别</text><text x="28" y="116" class="zh body">系统性缺陷与项目局部问题；改进候选</text><text x="28" y="144" class="zh small">需人工批准与回归测试后才能升级。</text>
  </g>

  <text x="60" y="875" class="zh h2">分层产品链</text>
  <g transform="translate(60 905)">
    <rect x="0" y="0" width="135" height="85" rx="14" class="pill"/><text x="67" y="51" text-anchor="middle" class="zh h3" style="font-size:18px">原始资料</text>
    <path d="M145 42 L178 42" class="arrow"/>
    <rect x="190" y="0" width="135" height="85" rx="14" class="pill"/><text x="257" y="51" text-anchor="middle" class="zh h3" style="font-size:18px">专业底稿</text>
    <path d="M335 42 L368 42" class="arrow"/>
    <rect x="380" y="0" width="150" height="85" rx="14" class="pill"/><text x="455" y="35" text-anchor="middle" class="zh h3" style="font-size:17px">Base DD</text><text x="455" y="60" text-anchor="middle" class="zh small">基础尽调报告</text>
    <path d="M540 42 L573 42" class="arrow"/>
    <rect x="585" y="0" width="175" height="85" rx="14" fill="#edf8ef" stroke="#b7d9bf" stroke-width="2"/><text x="672" y="33" text-anchor="middle" class="zh h3" style="font-size:16px;fill:#25733e">Supplemental</text><text x="672" y="57" text-anchor="middle" class="zh small">/ Web Research</text>
    <path d="M770 42 L803 42" class="arrow"/>
    <rect x="815" y="0" width="135" height="85" rx="14" fill="#fff6e8" stroke="#e9cc95" stroke-width="2"/><text x="882" y="35" text-anchor="middle" class="zh h3" style="font-size:16px;fill:#9a6200">Specialist</text><text x="882" y="59" text-anchor="middle" class="zh small">专项报告</text>
    <path d="M960 42 L993 42" class="arrow"/>
    <rect x="1005" y="0" width="135" height="85" rx="14" fill="#f1effb" stroke="#c9c2e8" stroke-width="2"/><text x="1072" y="35" text-anchor="middle" class="zh h3" style="font-size:15px;fill:#5d4795">Integrated DD</text><text x="1072" y="59" text-anchor="middle" class="zh small">综合尽调报告</text>
  </g>
  <text x="60" y="1028" class="zh body">→ Investment Memo / Action Book：面向投决的结论、交易条件、风险与行动清单。</text>

  <text x="60" y="1095" class="zh h2">质量门禁：三个“PASS”必须分开</text>
  <g transform="translate(60 1125)">
    <rect width="340" height="145" rx="18" fill="#edf8ef" stroke="#b7d9bf" stroke-width="2"/>
    <text x="28" y="43" class="zh h3" style="fill:#25733e">Delivery Integrity</text>
    <text x="28" y="75" class="zh body">交付是否完整</text><text x="28" y="106" class="zh small">报告、底稿、引用、实体文件与结构齐全。</text>
  </g>
  <g transform="translate(430 1125)">
    <rect width="340" height="145" rx="18" fill="#fff6e8" stroke="#e9cc95" stroke-width="2"/>
    <text x="28" y="43" class="zh h3" style="fill:#9a6200">Substantive DD Completion</text>
    <text x="28" y="75" class="zh body">实质尽调完成度</text><text x="28" y="106" class="zh small">专业审阅、专项尽调和关键证据是否闭合。</text>
  </g>
  <g transform="translate(800 1125)">
    <rect width="340" height="145" rx="18" fill="#f1effb" stroke="#c9c2e8" stroke-width="2"/>
    <text x="28" y="43" class="zh h3" style="fill:#5d4795">Decision Readiness</text>
    <text x="28" y="75" class="zh body">投资决策就绪度</text><text x="28" y="106" class="zh small">是否具备估值、报价、投委会和交易条件。</text>
  </g>
  <rect x="60" y="1290" rx="14" width="1080" height="64" fill="#eaf2fb" stroke="#c2d6ea" stroke-width="2"/>
  <text x="600" y="1331" text-anchor="middle" class="zh tag">报告交付完成 ≠ 实质尽调完成 ≠ 投资决策就绪</text>

  <text x="60" y="1415" class="zh h2">Public Core / Private Runtime Boundary</text>
  <rect x="60" y="1440" width="520" height="92" rx="16" fill="#eef5fc" stroke="#c4d8ec" stroke-width="2"/>
  <text x="88" y="1477" class="zh h3">公开 GitHub</text><text x="88" y="1508" class="zh small">项目中立代码、Schema、Validator、Runbook、Synthetic Fixtures</text>
  <rect x="620" y="1440" width="520" height="92" rx="16" fill="#fff4f4" stroke="#e6c3c3" stroke-width="2"/>
  <text x="648" y="1477" class="zh h3" style="fill:#8a3a3a">私有工作区</text><text x="648" y="1508" class="zh small">真实项目资料、System Current、底稿、报告与交易事实绝不进入公共仓库</text>

  <rect x="0" y="1560" width="1200" height="40" fill="#0d2f5f"/>
  <text x="60" y="1586" class="zh white" style="font-size:15px;font-weight:600">IntelliDue · Human-supervised AI due diligence · Public overview</text>
  <text x="1140" y="1586" text-anchor="end" class="zh white" style="font-size:14px">Public visibility ≠ software license</text>
</svg>